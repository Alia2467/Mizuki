name: Regression checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop-plugin-web:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r Mizuki/desktop/requirements.txt -r test/requirements.txt
      - name: Run regression tests
        run: python -m pytest test/ -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Unit tests and Debug APK
        working-directory: Mizuki/android
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --console=plain
