[plugin]
enabled = true
config_version = "1.1.3"

[source]
data_url = "http://localhost:821/merged-data"
token = ""          # 与控制台 config.json 的 shared_token 一致；控制台未启用鉴权时留空
fetch_interval = 300

[target]
platform = "qq"
chat_type = "private"
user_id = ""
group_id = ""

[proactive]
cooldown_ms = 180000

[rules]

# 声明式规则表：key 必须唯一；按顺序合并所有命中规则，仅主动触发一次。
# 手机离线时忽略 phone 缓存，电脑规则仍可运行；导航/通话只静音，不额外发消息。
# 成功冷却仅在 SDK 明确确认受理后记录；失败按规则独立退避 5–60 秒。
# 已确认的上下文不会因触发失败而重复追加；未知 SDK 返回不按成功处理。
# op 取值：>= / > / <= / < / == / in（in 时 value 为非空列表）；模板支持 {value}。
[[rules.table]]
key = "heart_high"
enabled = true
field = "phone.health.heart_rate"
op = ">="
value = 100
situation = "当前心率 {value} 次/分，偏高。"
intent = "心率有点偏高，温柔地关心 TA，提醒 TA 别太累、注意休息。"

[[rules.table]]
key = "steps"
enabled = true
field = "phone.health.steps"
op = ">="
value = 10000
situation = "今天已经走了 {value} 步。"
intent = "今天走了很多路，心疼地关心 TA，让 TA 放松一下腿。"

[[rules.table]]
key = "weather_rain"
enabled = true
field = "phone.weather.condition"
op = "in"
# 候选值与契约受控词表（架构规格 §2.1）一致
value = ["rain", "snow", "shower", "drizzle", "thunderstorm"]
situation = "当前天气为 {value}。"
intent = "外面在下雨（或下雪），提醒 TA 出门带伞、路上注意安全。"

[[rules.table]]
key = "weather_hot"
enabled = true
field = "phone.weather.temperature"
op = ">="
value = 35
situation = "当前温度 {value} ℃，比较热。"
intent = "天气很热，提醒 TA 多喝水、注意防暑。"
